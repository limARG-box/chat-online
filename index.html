<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>匿名聊天室 #4471</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0d0f12; color: #c9d1d9;
    font-family: "SF Mono", Consolas, monospace;
    height: 100vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid #21262d;
    font-size: 13px; color: #6e7681;
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
  }
  header .time { color: #f0883e; font-weight: bold; }
  header b { color: #58a6ff; }
  header .reset-btn {
    margin-left: auto; background: none; border: 1px solid #30363d;
    color: #6e7681; padding: 4px 10px; cursor: pointer;
    font-family: inherit; font-size: 12px; border-radius: 3px;
  }
  header .reset-btn:hover { color: #c9d1d9; border-color: #6e7681; }
  #log {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
    position: relative;
  }
  .msg { max-width: 78%; line-height: 1.6; font-size: 14px; white-space: pre-wrap; }
  .them { align-self: flex-start; }
  .me   { align-self: flex-end; text-align: right; color: #7ee787; }
  .sys  { align-self: center; color: #6e7681; font-size: 12px; font-style: italic; }
  .end  { align-self: center; text-align: center; color: #f0883e; font-size: 15px; line-height: 2; margin-top: 20px; }
  .name { font-size: 11px; color: #6e7681; margin-bottom: 3px; }
  .msg a { color: #58a6ff; text-decoration: underline; word-break: break-all; }
  .msg a:hover { color: #79c0ff; }

  .chatimg-wrap {
    display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap;
  }
  .chatimg {
    width: 120px; height: 90px;
    object-fit: cover;
    border: 1px solid #30363d; border-radius: 4px;
    cursor: pointer;
    transition: transform .18s, border-color .18s;
    background: #161b22;
  }
  .chatimg:hover {
    transform: scale(1.04);
    border-color: #58a6ff;
  }

  #bar { display: flex; border-top: 1px solid #21262d; flex-shrink: 0; }
  #in {
    flex: 1; background: transparent; border: 0; outline: 0;
    color: #c9d1d9; font: inherit; padding: 14px 16px;
  }
  #send {
    background: #238636; color: #fff; border: 0; padding: 0 22px;
    font: inherit; cursor: pointer;
  }
  #send:hover { background: #2ea043; }

  body.shaking {
    animation: continuousShake .14s linear infinite;
  }
  @keyframes continuousShake {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-2px, 1px); }
    50%  { transform: translate(1px, -2px); }
    75%  { transform: translate(-1px, 2px); }
    100% { transform: translate(2px, -1px); }
  }

  .img-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 3000;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    padding: 24px;
  }
  .img-modal.show { display: flex; }
  .img-modal img {
    max-width: 92vw;
    max-height: 92vh;
    object-fit: contain;
    border: 1px solid #30363d;
    border-radius: 6px;
    box-shadow: 0 0 60px rgba(0,0,0,.9);
  }

  .red-flood-overlay {
    position: fixed; inset: 0; pointer-events: none;
    z-index: 500; overflow: hidden;
  }
  .red-flood-overlay span {
    position: absolute;
    left: 50%; top: 50%;
    color: #c0392b;
    font-weight: 700;
    white-space: nowrap;
    text-shadow: 0 0 10px rgba(192,57,43,.9);
    will-change: transform, opacity;
    transform: translate(-50%, -50%) translate(var(--sx), var(--sy));
    transition: transform 9s cubic-bezier(.45,.05,.55,.95), opacity .6s;
    opacity: 0;
  }
  .red-flood-overlay span.active {
    opacity: 1;
  }

  .white-overlay {
    position: fixed; inset: 0;
    display: none;
    z-index: 600;
    pointer-events: auto;
    cursor: pointer;
    overflow: hidden;
  }
  .white-overlay.show { display: flex; }
  .white-center {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: radial-gradient(circle at center, rgba(13,15,18,.94) 0%, rgba(13,15,18,.82) 30%, rgba(13,15,18,0) 70%);
  }
  .white-msg {
    font-size: 28px;
    font-weight: 700;
    color: #ffffff;
    text-shadow: 0 0 22px rgba(255,255,255,.95), 0 0 50px rgba(192,57,43,.45);
    text-align: center;
    padding: 0 24px;
    line-height: 1.6;
    max-width: 82vw;
    white-space: pre-wrap;
    animation: whitePulse 2.4s ease-in-out infinite;
  }
  @keyframes whitePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .deep-red-msg {
    margin-top: 26px;
    font-size: 18px;
    font-weight: 700;
    color: #8b1a1a;
    text-shadow: 0 0 14px rgba(139,26,26,1);
    text-align: center;
    letter-spacing: 2px;
    opacity: 0;
    animation: deepRedIn .7s ease forwards;
  }
  .deep-red-msg.fade-out {
    animation: deepRedOut .8s ease forwards;
  }
  @keyframes deepRedIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes deepRedOut {
    from { opacity: 1; }
    to { opacity: 0; }
  }
  .continue-hint {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #6e7681;
    font-family: "SF Mono", Consolas, monospace;
    letter-spacing: 2px;
    animation: hintBlink 1.6s ease-in-out infinite;
    user-select: none;
  }
  @keyframes hintBlink {
    0%, 100% { opacity: .35; }
    50% { opacity: .95; }
  }

  .police-overlay {
    position: fixed; inset: 0;
    background: #0f2647;
    z-index: 1000;
    display: none;
    overflow-y: auto;
    padding: 0;
  }
  .police-overlay.show { display: block; }
  .police-wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 60px 24px 80px;
    color: #e8f0ff;
    font-family: "Microsoft YaHei","PingFang SC",sans-serif;
  }
  .police-badge {
    display: inline-block;
    background: #1e4a8a;
    color: #fff;
    font-size: 12px;
    padding: 4px 14px;
    border-radius: 3px;
    letter-spacing: 2px;
    margin-bottom: 20px;
  }
  .police-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 8px;
    color: #ffffff;
  }
  .police-sub {
    font-size: 13px;
    color: #8db0e8;
    margin-bottom: 36px;
    letter-spacing: 1px;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(141,176,232,.25);
  }
  .police-body {
    font-size: 15px;
    line-height: 2.1;
    color: #d1e0f7;
  }
  .police-body p {
    margin-bottom: 18px;
    text-indent: 2em;
  }
  .police-body p.no-indent { text-indent: 0; }
  .police-body b { color: #ffffff; }
  .police-sign {
    margin-top: 40px;
    text-align: right;
    font-size: 14px;
    line-height: 2;
    color: #8db0e8;
  }
  .police-divider {
    margin: 60px 0 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(141,176,232,.4), transparent);
  }
  .deity-block {
    text-align: center;
    padding: 20px 0 40px;
  }
  .deity-photo {
    width: 100%;
    max-width: 380px;
    margin: 0 auto 24px;
    display: block;
    border-radius: 4px;
    box-shadow: 0 0 40px rgba(141,176,232,.25);
    background: #0a1930;
    min-height: 300px;
    object-fit: cover;
  }
  .deity-caption {
    font-size: 18px;
    color: #ffffff;
    letter-spacing: 8px;
    font-weight: 700;
    text-shadow: 0 0 20px rgba(141,176,232,.7);
  }
  .deity-caption-sub {
    margin-top: 10px;
    font-size: 12px;
    color: #8db0e8;
    letter-spacing: 3px;
  }
  .clear-banner {
    margin-top: 60px;
    padding: 22px 20px;
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #ffffff;
    background: rgba(30,74,138,.35);
    border: 1px solid rgba(141,176,232,.4);
    border-radius: 8px;
    text-shadow: 0 0 18px rgba(141,176,232,.6);
    font-family: "Microsoft YaHei","PingFang SC",sans-serif;
  }
</style>
</head>
<body>
<header>
  <span class="time">2024-8-11</span>
  <span>匿名聊天室 <b>#4471</b> · 端到端加密 · 无日志</span>
  <button class="reset-btn" onclick="resetChat()">重置</button>
</header>
<div id="log"></div>
<div id="bar">
  <input id="in" placeholder="输入消息…" autocomplete="off">
  <button id="send">发送</button>
</div>

<div class="img-modal" id="imgModal" onclick="closeZoom()">
  <img id="imgModalImg" src="" alt="">
</div>

<script>
/* ============================================================
   剧本
   ============================================================ */
const SCRIPT = {
  opening: `大哥们在么，我哥最近……不太对劲。嘴里总是念叨着什么，情绪也变得很多，虽说他确实快高考了，但也不至于这样吧
我把我哥的<a href="https://xuk001.github.io/limarg/" target="_blank" rel="noopener">学校网址</a>和他的<a href="https://xuk001.github.io/treehole/" target="_blank" rel="noopener">动态空间</a>发给你了，我和他同个中学但完全不知道发生什么。
他的账号密码应该是他比较重要的日子。比如生日？
对了，我哥叫林凯，你知道我叫什么名字吗？`,

  stages: [
    {
      keys: ["林文昌"],
      reply: "……\n你真查到了。\n程序员、记者，还是侦探？你这调查能力有点吓人啊。\n\n对，我叫林文昌，林凯的亲弟弟。\n既然你连我都能挖出来，那我哥的事，就拜托你了。\n\n那再考考你——你能查到我哥动态空间的账号密码吗？"
    },
    {
      keys: ["20060911"],
      reply: "20060911……你连这个都挖到了。\n\n行，动态空间你进去吧，里面的东西，你自己看。\n我哥最近念叨的就是那些——我一个字都看不懂，但总觉得不对劲。\n\n你觉得是谁害了他？"
    },
    {
      keys: ["罗克生"],
      reply: "罗克生……果然。\n我早就看他不顺眼了。\n我哥经常跟我提起他。\n\n他还说过一个地方，叫「寄望实验室」，说是秘密的，谁都不许提。\n你能不能……去查查那个实验室？\n\n对了——我哥之前在生物工程的书上写过一句话：「寄望实验室，是将「生物的希望」寄托于我们，这也是我的信念。」\n\n等下，我哥突然说要出门，我偷偷跟上去了……结果到了学校，人就不见了。\n你觉得，要去哪？"
    },
    {
      keys: ["实验楼"],
      reply: "实验楼……对，他最近总往那儿跑。\n\n我到了。\n十层楼，晚上还有几个窗口亮着灯。\n我不敢上去，只能贴着墙在楼下站着。\n\n可我站在楼下才发现——\n这么大一栋楼，一层几十间教室。\n他那天被带去哪一间，我根本不知道。\n\n你能帮我查一下吗？\n"
    },
    {
      keys: ["202教室", "202"],
      reply: "202……对，二楼的教室。\n\n我上去了。\n门虚掩着，我推开一条缝往里看——\n\n一圈人，站得很密。\n我哥在里面。\n\n不是中间那个。是站在人群里，跟其他人站在一起。\n中间那个人，背对着我，穿了件我没见过的外套。\n罗克生也在。\n\n我没敢多看，退出来，去了他的办公室。\n桌上压着两张纸，我拍下来了——\n<div class=\"chatimg-wrap\"><img src=\"password.jpg\" class=\"chatimg\" alt=\"密码本\" onclick=\"zoomImage(this.src)\"><img src=\"box.png\" class=\"chatimg\" alt=\"盒子\" onclick=\"zoomImage(this.src)\"></div>\n\n我总觉得罗克生一定有问题。\n你要是能查到什么证据，就发给我——我去举报。",
      raw: true
    },
    {
      keys: [],
      reply: ""
    }
  ],

  fallback: [
    "（想好再回答）",
    "错了哦：）",
  ]
};

/* ============================================================
   引擎基础
   ============================================================ */
const log = document.getElementById('log');
const inp = document.getElementById('in');
const send = document.getElementById('send');

let fallbackIdx = 0;
let stageIdx = 0;
let ended = false;

const SHOCK_MSGS = [
  '……？这是……我知道了……',
  '罗克生那个贱人找你了对吧。',
  '看来……是时候了。',
  '等等…为什么……找不到…他？',
  'TM的！？罗克生！！我知道你也在看！！',
  '你宁愿把自己的前额叶切除都不愿拥护我吗！？我可是神的使者！！',
  '无妨，祂赐予我的能力，就算是相隔甚远，也足以发动，祂的降临不可阻止。',
  '我煞费苦心，只是为了让祂看到人间百态。',
  '不要以为你们能独善其身。',
  '起来吧，回应我，全体使徒！'
];

const WHITE_MSGS = [
  '安静！！',
  '抱歉，来迟了。',
  '哈…李恩，怎么样，这种感觉。',
  '对…别忘了，母虫有两只。',
  '我不会让你伤害我的学生的',
  '这是我… 最后的赎罪了…'
];

/* ============================================================
   基础工具
   ============================================================ */
function escapeHTML(s) {
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function add(text, who = 'them', name = '', raw = false) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.innerHTML = (name ? `<div class="name">${name}</div>` : '') + (raw ? text : escapeHTML(text));
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function shakeStart() { document.body.classList.add('shaking'); }
function shakeStop()  { document.body.classList.remove('shaking'); }

function zoomImage(src) {
  const modal = document.getElementById('imgModal');
  const img = document.getElementById('imgModalImg');
  img.src = src;
  modal.classList.add('show');
}
function closeZoom() {
  document.getElementById('imgModal').classList.remove('show');
}

/* ============================================================
   分段发送
   ============================================================ */
function sendSegments(text, opts, onDone) {
  const parts = String(text).split(/\n\n+/).filter(s => s.trim().length);
  let i = 0;

  function next() {
    if (i >= parts.length) { onDone && onDone(); return; }
    if (ended) return;

    const seg = parts[i];
    const isLast = (i === parts.length - 1);

    add('对方正在输入…', 'sys');
    const typingDelay = Math.min(1800, 500 + seg.length * 20);

    setTimeout(() => {
      if (log.lastChild && log.lastChild.classList.contains('sys')) {
        log.lastChild.remove();
      }

      if (isLast && opts.end) {
        const d = document.createElement('div');
        d.className = 'msg end';
        d.innerHTML = escapeHTML(seg);
        log.appendChild(d);
        log.scrollTop = log.scrollHeight;
        finish();
      } else {
        add(seg, 'them', '', !!opts.raw);
      }

      i++;
      if (i < parts.length) {
        setTimeout(next, 800 + Math.random() * 800);
      } else {
        onDone && onDone();
      }
    }, typingDelay);
  }

  next();
}

function reply(text, delay, opts = {}) {
  setTimeout(() => {
    if (ended) return;
    sendSegments(text, opts, () => {
      if (opts.after && opts.afterText && !ended) {
        setTimeout(() => {
          if (ended) return;
          sendSegments(opts.afterText, { end: opts.endAfter }, null);
        }, opts.after);
      }
    });
  }, delay);
}

function finish() {
  ended = true;
  setTimeout(() => {
    add('系统：连接已关闭', 'sys');
    inp.disabled = true;
    send.disabled = true;
    send.style.opacity = .4;
  }, 1600);
}

/* ============================================================
   handle
   ============================================================ */
function handle(input) {
  if (ended) return;
  const t = input.trim();
  if (!t) return;
  add(t, 'me');

  if (stageIdx === 5) {
    if (t === 'BIOH-0911-4711-4620') {
      stageIdx++;
      add('对方正在输入…', 'sys');
      setTimeout(() => {
        log.lastChild.remove();
        add('……\n对，就是这串东西。\n「BIOH-0911-4711-4620」——我记住了。\n\n终于拿到证据了。\n我现在就去教育局举报。\n谢谢你。真的。');
        setTimeout(() => {
          const d = document.createElement('div');
          d.className = 'msg end';
          d.textContent = '你已通关本arg游戏\n生物实验室…………了 ？';
          log.appendChild(d);
          log.scrollTop = log.scrollHeight;
          finish();
          setTimeout(() => transitionToPolice('missing'), 2800);
        }, 3000);
      }, 1500);
      return;
    }

    if (t === 'LIEN-QSDI-HCDM') {
      stageIdx++;
      ending2();
      return;
    }

    const fb = SCRIPT.fallback[fallbackIdx % SCRIPT.fallback.length];
    fallbackIdx++;
    add('对方正在输入…', 'sys');
    setTimeout(() => {
      log.lastChild.remove();
      add(fb);
    }, 900 + Math.random() * 800);
    return;
  }

  const stage = SCRIPT.stages[stageIdx];
  if (stage) {
    const hit = stage.keys.some(k => t.includes(k));
    if (hit) {
      stageIdx++;
      reply(stage.reply, 700 + Math.random() * 600, {
        raw: stage.raw, end: stage.end
      });
      return;
    }
  }

  const fb = SCRIPT.fallback[fallbackIdx % SCRIPT.fallback.length];
  fallbackIdx++;
  add('对方正在输入…', 'sys');
  setTimeout(() => {
    log.lastChild.remove();
    add(fb);
  }, 900 + Math.random() * 800);
}

/* ============================================================
   结局2
   ============================================================ */
function ending2() {
  let i = 0;

  function next() {
    if (i >= SHOCK_MSGS.length) {
      setTimeout(startRedFlood, 1000);
      return;
    }

    add('对方正在输入…', 'sys');
    setTimeout(() => {
      if (log.lastChild && log.lastChild.classList.contains('sys')) {
        log.lastChild.remove();
      }
      add(SHOCK_MSGS[i], 'them');

      if (i === 4) shakeStart();

      i++;
      const gap = 1500 + Math.random() * 900;
      setTimeout(next, gap);
    }, 700 + Math.random() * 500);
  }

  next();
}

/* 红字洪水：数量 1040，从四周缓慢向中心聚拢 */
function startRedFlood() {
  const overlay = document.createElement('div');
  overlay.className = 'red-flood-overlay';
  overlay.id = 'redFlood';
  document.body.appendChild(overlay);

  const words = ['寄生', '控制', '怀慈', '祂的降临', '我们一体'];
  const W = window.innerWidth;
  const H = window.innerHeight;

  const items = [];

  for (let i = 0; i < 1040; i++) {
    const span = document.createElement('span');
    span.textContent = words[Math.floor(Math.random() * words.length)];

    const side = Math.floor(Math.random() * 4);
    let sx, sy;
    switch (side) {
      case 0:
        sx = (Math.random() - .5) * W * 1.5;
        sy = -H * 0.85 - Math.random() * 120;
        break;
      case 1:
        sx = W * 0.85 + Math.random() * 120;
        sy = (Math.random() - .5) * H * 1.5;
        break;
      case 2:
        sx = (Math.random() - .5) * W * 1.5;
        sy = H * 0.85 + Math.random() * 120;
        break;
      default:
        sx = -W * 0.85 - Math.random() * 120;
        sy = (Math.random() - .5) * H * 1.5;
        break;
    }

    const tx = (Math.random() - .5) * W * 0.75;
    const ty = (Math.random() - .5) * H * 0.75;

    span.style.setProperty('--sx', sx + 'px');
    span.style.setProperty('--sy', sy + 'px');
    span.style.fontSize = (12 + Math.random() * 22) + 'px';
    span.style.transitionDuration = (8 + Math.random() * 4) + 's';
    span.style.transitionDelay = (Math.random() * 0.6) + 's';

    overlay.appendChild(span);
    items.push({ el: span, tx, ty });
  }

  requestAnimationFrame(() => {
    items.forEach(item => {
      item.el.classList.add('active');
      item.el.style.transform =
        'translate(-50%, -50%) translate(' + item.tx + 'px, ' + item.ty + 'px)';
    });
  });

  setTimeout(startWhiteSequence, 8500);
}

/* 白色消息序列 */
function startWhiteSequence() {
  const flood = document.getElementById('redFlood');
  if (flood) {
    flood.querySelectorAll('span').forEach(s => {
      s.style.transition = 'transform 2s cubic-bezier(.2,.8,.4,1), opacity 1.8s ease';
      const cur = s.style.transform;
      s.style.transform = cur.replace(/translate\((-?[\d.]+)px, (-?[\d.]+)px\)$/, (m, x, y) => {
        return 'translate(' + (x * 3.2) + 'px, ' + (y * 3.2) + 'px)';
      });
      s.style.opacity = '0';
    });
  }

  setTimeout(() => shakeStop(), 600);

  const overlay = document.createElement('div');
  overlay.className = 'white-overlay';
  overlay.id = 'whiteOverlay';
  overlay.innerHTML =
    '<div class="white-center">' +
      '<div class="white-msg" id="whiteMsg"></div>' +
    '</div>' +
    '<div class="continue-hint">点击屏幕继续</div>';
  document.body.appendChild(overlay);
  overlay.classList.add('show');

  overlay.addEventListener('click', advance);

  let step = 0;
  const total = WHITE_MSGS.length;

  function advance() {
    if (step >= total) {
      const floodEl = document.getElementById('redFlood');
      if (floodEl) {
        floodEl.style.transition = 'opacity 1s';
        floodEl.style.opacity = '0';
        setTimeout(() => floodEl.remove(), 1100);
      }
      overlay.style.transition = 'opacity .8s';
      overlay.style.opacity = '0';
      setTimeout(() => {
        overlay.remove();
        transitionToPolice('rescued');
      }, 900);
      return;
    }

    const msgEl = document.getElementById('whiteMsg');
    msgEl.textContent = WHITE_MSGS[step];
    msgEl.style.animation = 'none';
    void msgEl.offsetWidth;
    msgEl.style.animation = '';

    if (step === 2) {
      const old = overlay.querySelector('.deep-red-msg');
      if (old) old.remove();
      const dr = document.createElement('div');
      dr.className = 'deep-red-msg';
      dr.textContent = '你……你也……';
      overlay.querySelector('.white-center').appendChild(dr);
      setTimeout(() => {
        dr.classList.add('fade-out');
        setTimeout(() => dr.remove(), 800);
      }, 2000);
    }

    step++;
  }

  advance();
}

/* ============================================================
   转场 → 警方通报
   ============================================================ */
function transitionToPolice(variant) {
  // 深蓝幕布，颜色与警方通报背景一致，做出"沉入"的感觉
  const curtain = document.createElement('div');
  curtain.style.cssText =
    'position:fixed;inset:0;' +
    'background:#0f2647;' +
    'z-index:2500;' +
    'opacity:0;' +
    'transition:opacity 1s ease;' +
    'pointer-events:none;';
  document.body.appendChild(curtain);

  requestAnimationFrame(() => {
    curtain.style.opacity = '1';
  });

  setTimeout(() => {
    // 幕布全黑后挂载警方通报
    showPoliceReport(variant);
    // 通报淡入
    const police = document.getElementById('policeOverlay');
    if (police) {
      police.style.opacity = '0';
      police.style.transition = 'opacity 1s ease';
      requestAnimationFrame(() => {
        police.style.opacity = '1';
      });
    }
    // 幕布淡出
    setTimeout(() => {
      curtain.style.opacity = '0';
      setTimeout(() => curtain.remove(), 1100);
    }, 400);
  }, 1050);
}

/* ============================================================
   警方通报
   ============================================================ */

  send.style.opacity = .4;

  overlay.id = 'policeOverlay';

  const endingLine = (variant === 'missing')
    ? '另据校方通报，目前仍有 <b>11 名同学</b>失联，公安机关正全力开展查找工作。'
    : '目前，已有 <b>11 名受害者</b>被成功找回，相关善后与救助工作正在有序开展。';

  const clearLine = (variant === 'missing')
    ? '🎉 恭喜你，通关 瑾才中学ARG 了……吗？'
    : '🎉 恭喜你，通关 瑾才中学ARG 了';

  overlay.innerHTML =
    '<div class="police-wrap">' +
      '<span class="police-badge">警情通报</span>' +
      '<div class="police-title">福建省白州市公安局</div>' +
      '<div class="police-sub">发布时间：2024-08-11 09:30</div>' +
      '<div class="police-body">' +
        '<p>近日，我局接到群众举报，反映白州市瑾才中学一名教职工罗某某涉嫌违法犯罪。接报后，我局高度重视，第一时间成立专案组，对相关情况开展全面核查。</p>' +
        '<p>经初步查明，罗某某（男，瑾才中学生物教研组教师），涉嫌在校内长期从事非法人体实验，利用职务之便对在校学生实施不法行为，情节严重。相关线索正在进一步侦办中。</p>' +
        '<p>2024 年 8 月 10 日晚，罗某某在瑾才中学实验楼坠亡。经现场勘查与法医鉴定，初步排除他杀可能，综合判断系畏罪自杀。</p>' +
        '<p class="no-indent">' + endingLine + '</p>' +
        '<p>目前，我局已联合教育主管部门对瑾才中学相关人员逐一进行排查，对涉及失职、渎职的相关责任人依法依规追究责任。</p>' +
        '<p>警方提醒：请广大群众不信谣、不传谣，相关情况以官方发布为准。</p>' +
      '</div>' +
      '<div class="police-sign">' +
        '福建省白州市公安局<br>' +
        '2024 年 8 月 11 日' +
      '</div>' +
      '<div class="police-divider"></div>' +
      '<div class="deity-block">' +
        '<img src="image5.png" class="deity-photo" alt="怀慈斗母" onerror="this.style.display=\'none\'">' +
        '<div class="deity-caption">祂仍在看</div>' +
        '<div class="deity-caption-sub">—— 有的事，警方管不了 ——</div>' +
      '</div>' +
      '<div class="clear-banner">' + clearLine + '</div>' +
    '</div>';

  document.body.appendChild(overlay);
  overlay.classList.add('show');
  overlay.scrollTop = 0;
}

/* ============================================================
   重置
   ============================================================ */
function resetChat() {
  location.reload();
}

/* ============================================================
   启动
   ============================================================ */
send.onclick = () => { handle(inp.value); inp.value = ''; };
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter') { handle(inp.value); inp.value = ''; }
});

setTimeout(() => {
  add('系统：已连接到匿名频道', 'sys');
  setTimeout(() => add(SCRIPT.opening, 'them', '', true), 800);
}, 400);
</script>
